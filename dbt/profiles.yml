# Connection settings come from environment variables. Never put values here.
# Locally, load them from the repo's .env: uv run --env-file ../.env dbt <command>
power_pipeline:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: power_dbt_dev
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') | replace('/', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4

    prod:
      type: databricks
      catalog: workspace
      schema: power_dbt
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') | replace('/', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
